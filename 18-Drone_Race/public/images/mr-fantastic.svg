<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep futuristic glows -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="blueprint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.8"/>
    </linearGradient>
    
    <radialGradient id="mesh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Atmospheric background radial haze -->
  <rect width="100%" height="100%" fill="#020617" />
  <circle cx="300" cy="300" r="300" fill="url(#mesh-glow)" />

  <!-- Blueprint Technical Grid overlay -->
  <g opacity="0.25">
    <circle cx="300" cy="300" r="280" fill="none" stroke="#2563eb" stroke-width="0.75" />
    <circle cx="300" cy="300" r="220" fill="none" stroke="#0891b2" stroke-width="0.75" stroke-dasharray="4 8" />
    <circle cx="300" cy="300" r="160" fill="none" stroke="#2563eb" stroke-width="0.5" />
    <circle cx="300" cy="300" r="100" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="2 4" />
    
    <!-- Crosshairs -->
    <line x1="20" y1="300" x2="580" y2="300" stroke="#2563eb" stroke-width="0.5" />
    <line x1="300" y1="20" x2="300" y2="580" stroke="#2563eb" stroke-width="0.5" />
    
    <!-- Fine alignment ticks -->
    <path d="M 300 40 L 310 40 M 300 80 L 305 80 M 300 120 L 305 120 M 300 160 L 305 160" stroke="#0891b2" stroke-width="1" />
    <path d="M 300 560 L 310 560 M 300 520 L 305 520 M 300 480 L 305 480 M 300 440 L 305 440" stroke="#0891b2" stroke-width="1" />
  </g>

  <!-- Stretching Arcs / Dimensional Elastic Geometry -->
  <g filter="url(#glow-cyan)" opacity="0.85">
    <!-- Fluid flowing elastic Bezier curves -->
    <path d="M 80 300 C 180 120, 420 120, 520 300" fill="none" stroke="url(#blueprint-grad)" stroke-width="3" />
    <path d="M 80 300 C 180 480, 420 480, 520 300" fill="none" stroke="url(#blueprint-grad)" stroke-width="2" />
    <path d="M 300 80 C 120 180, 120 420, 300 520" fill="none" stroke="url(#blueprint-grad)" stroke-width="1.5" />
    <path d="M 300 80 C 480 180, 480 420, 300 520" fill="none" stroke="url(#blueprint-grad)" stroke-width="2.5" />
  </g>

  <!-- Coordinate Nodes & Scanning Radar Rings -->
  <g stroke="#0891b2" stroke-width="0.75" opacity="0.6">
    <line x1="165" y1="165" x2="230" y2="230" stroke-dasharray="3 3" />
    <circle cx="165" cy="165" r="6" fill="#020617" stroke="#0891b2" stroke-width="1.5" filter="url(#glow-cyan)" />
    
    <line x1="435" y1="435" x2="370" y2="370" stroke-dasharray="3 3" />
    <circle cx="435" cy="435" r="6" fill="#020617" stroke="#0891b2" stroke-width="1.5" filter="url(#glow-cyan)" />
    
    <circle cx="300" cy="300" r="14" fill="none" stroke="#2563eb" stroke-width="1" />
  </g>

  <!-- Central Scientific Core (Stretched Geometric "4") -->
  <g transform="translate(230, 230)" filter="url(#glow-blue)">
    <!-- Protective Inner HUD Ring -->
    <circle cx="70" cy="70" r="65" fill="#020617" fill-opacity="0.9" stroke="#2563eb" stroke-width="2" />
    <circle cx="70" cy="70" r="58" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    
    <!-- Bold Tech styled "4" representing scientific unity -->
    <path d="M 78 28 L 44 80 L 98 80 M 78 28 L 78 112" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Technical Labels and Measurement Monospace Metadata -->
  <g font-family="monospace" font-size="10" fill="#0891b2" opacity="0.8">
    <!-- Top left reads -->
    <text x="50" y="70" font-weight="bold">MODEL: RICHARDS_R_04</text>
    <text x="50" y="85">TYPE: MOLECULAR_ELASTICITY</text>
    <text x="50" y="100">SYS_V: 98.42%</text>
    
    <!-- Top right reads -->
    <text x="430" y="70" text-anchor="end" font-weight="bold">COORD_SCAN: READY</text>
    <text x="430" y="85" text-anchor="end">RANGE: STRETCH_MAX</text>
    <text x="430" y="100" text-anchor="end">GRID: SEC_F4_ presentation</text>

    <!-- Center tags -->
    <text x="320" y="220" font-size="9" fill="#2563eb">RADIUS: 140MM</text>
    <text x="320" y="390" font-size="9" fill="#2563eb">STRETCH ARCS: 4-WAY</text>

    <!-- Bottom Left Readouts -->
    <text x="50" y="515">SYS.CALIBRATION: ACTIVE</text>
    <text x="50" y="530">MATRIX_STABILITY: SECURE</text>
    <text x="50" y="545">DEPT: KPRIET ECE LABS</text>

    <!-- Bottom Right Readouts -->
    <text x="550" y="515" text-anchor="end">DATE_STAMP: 18-09-2026</text>
    <text x="550" y="530" text-anchor="end">TIME_REF: 10:00:00 UTC</text>
    <text x="550" y="545" text-anchor="end">IGNITRON 2026-27</text>
  </g>
</svg>
