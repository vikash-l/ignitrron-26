<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glow filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear Gradients -->
    <linearGradient id="grad-blue-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>
    
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-radial)" />

  <!-- Scientific Blueprint Grid -->
  <g opacity="0.15">
    <line x1="64" y1="0" x2="64" y2="512" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="128" y1="0" x2="128" y2="512" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="192" y1="0" x2="192" y2="512" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="256" y1="0" x2="256" y2="512" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="320" y1="0" x2="320" y2="512" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="384" y1="0" x2="384" y2="512" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="448" y1="0" x2="448" y2="512" stroke="#06b6d4" stroke-width="0.5" />

    <line x1="0" y1="64" x2="512" y2="64" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="0" y1="128" x2="512" y2="128" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="0" y1="192" x2="512" y2="192" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="0" y1="256" x2="512" y2="256" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="320" x2="512" y2="320" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="0" y1="384" x2="512" y2="384" stroke="#06b6d4" stroke-width="0.5" />
    <line x1="0" y1="448" x2="512" y2="448" stroke="#06b6d4" stroke-width="0.5" />
  </g>

  <!-- Concentric Radar / Calibration Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Outer Tech Angle Markers -->
  <path d="M 50 120 L 50 50 L 120 50" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <path d="M 462 120 L 462 50 L 392 50" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <path d="M 50 392 L 50 462 L 120 462" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <path d="M 462 392 L 462 462 L 392 462" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />

  <!-- Stretching Arcs / Elasticity Lines (Mr. Fantastic theme) -->
  <path d="M 50 256 Q 180 180 256 256 T 462 256" fill="none" stroke="url(#grad-blue-cyan)" stroke-width="3" filter="url(#glow-blue)" opacity="0.8" />
  <path d="M 256 50 Q 180 180 256 256 T 256 462" fill="none" stroke="url(#grad-blue-cyan)" stroke-width="3" filter="url(#glow-blue)" opacity="0.8" />
  
  <path d="M 90 90 Q 220 150 256 256 T 422 422" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  <path d="M 90 422 Q 220 362 256 256 T 422 90" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Floating Hologram Nodes -->
  <g filter="url(#glow-cyan)">
    <circle cx="90" cy="200" r="5" fill="#06b6d4" />
    <line x1="90" y1="200" x2="160" y2="230" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
    <text x="75" y="185" fill="#06b6d4" font-family="monospace" font-size="10" opacity="0.8">NODE_01: ELASTIC</text>
    
    <circle cx="422" cy="312" r="5" fill="#06b6d4" />
    <line x1="422" y1="312" x2="352" y2="282" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
    <text x="360" y="335" fill="#06b6d4" font-family="monospace" font-size="10" opacity="0.8">COORD: X_STRETCH</text>
  </g>

  <!-- Central Scientific Core (Fantastic Four '4' Symbol in Blueprint style) -->
  <g transform="translate(181, 181)" filter="url(#glow-cyan)">
    <!-- Outer Shield Circle -->
    <circle cx="75" cy="75" r="70" fill="#020617" fill-opacity="0.8" stroke="#06b6d4" stroke-width="3" />
    <circle cx="75" cy="75" r="64" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 4" />
    
    <!-- Stylized "4" Emblem -->
    <path d="M 85 30 
             L 45 85 
             L 105 85 
             M 85 30 
             L 85 120" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Scientific HUD Elements & Data Reads -->
  <g font-family="monospace" font-size="10" fill="#06b6d4" opacity="0.7">
    <text x="64" y="90">SYS.STATUS: ACTIVE</text>
    <text x="64" y="105">SIGNAL: SECURE</text>
    <text x="330" y="90">GRID REFERENCE: FF-04</text>
    <text x="330" y="105">STRETCH RANGE: MAX</text>
    
    <text x="64" y="420">CALIBRATION: COMPLETE</text>
    <text x="64" y="435">SYS.TYPE: MR. FANTASTIC</text>
    <text x="310" y="420">DEPT: R&amp;D PRESENTATION</text>
    <text x="310" y="435">LOC: KPRIET ECE LABS</text>
  </g>
</svg>
