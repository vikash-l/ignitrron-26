<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Kinetic Purple Energy Glow Gradient -->
    <radialGradient id="energyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3BE6" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#E626FF" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#8F26FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050408" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Armor Gradient -->
    <linearGradient id="armorMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1C54" />
      <stop offset="50%" stop-color="#1A0D2A" />
      <stop offset="100%" stop-color="#0B0514" />
    </linearGradient>

    <!-- Trenchcoat Gradient -->
    <linearGradient id="coatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#543120" />
      <stop offset="40%" stop-color="#381D10" />
      <stop offset="100%" stop-color="#150A05" />
    </linearGradient>

    <!-- Glowing Eye Gradient -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3BE6" />
      <stop offset="60%" stop-color="#E626FF" />
      <stop offset="100%" stop-color="#6B1FDB" />
    </radialGradient>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Energy Aura Layer (Hand & Card Area) -->
  <circle cx="240" cy="380" r="180" fill="url(#energyGlow)" filter="url(#strongGlow)" />
  <circle cx="240" cy="380" r="90" fill="#E626FF" opacity="0.3" filter="url(#blurGlow)" />

  <g id="gambit-character-group">
    <!-- Trenchcoat Back/Tail -->
    <path d="M 120 400 Q 80 550 40 780 L 320 800 Q 300 580 280 420 Z" fill="url(#coatGradient)" opacity="0.9" />

    <!-- Torso & Metallic Chestplate -->
    <path d="M 220 280 L 340 280 L 370 450 L 200 450 Z" fill="url(#armorMetal)" stroke="#8F26FF" stroke-width="1.5" />
    
    <!-- Chest Armor Lines/Segment Details -->
    <path d="M 250 300 L 310 300 M 240 330 L 320 330 M 235 360 L 325 360 M 245 400 L 315 400" stroke="#E626FF" stroke-width="2" opacity="0.7" />

    <!-- Left Arm & Shoulder Guard -->
    <path d="M 340 280 Q 420 310 440 440 L 380 460 Q 360 350 320 320 Z" fill="url(#armorMetal)" stroke="#6B1FDB" />

    <!-- Right Arm Extending Forward Holding Card -->
    <path d="M 220 290 Q 160 340 180 420 L 230 420 Q 220 360 250 320 Z" fill="url(#coatGradient)" />

    <!-- Trenchcoat Collar & Lapels -->
    <path d="M 200 240 L 150 340 L 220 320 L 260 250 Z" fill="#422416" stroke="#1F0A1C" />
    <path d="M 360 240 L 410 340 L 340 320 L 300 250 Z" fill="#422416" stroke="#1F0A1C" />

    <!-- Neck & Chin -->
    <path d="M 260 220 L 300 220 L 290 260 L 270 260 Z" fill="#D8A082" />

    <!-- Head & Iconic Open-Face Hood/Mask -->
    <!-- Headpiece outline -->
    <path d="M 235 150 Q 280 120 325 150 L 335 240 Q 280 275 225 240 Z" fill="#1A0D2A" stroke="#8F26FF" stroke-width="2" />
    <!-- Face area cut-out -->
    <path d="M 250 170 Q 280 160 310 170 L 305 230 Q 280 245 255 230 Z" fill="#E2AC8F" />

    <!-- Hair (Auburn Flowing Spikes) -->
    <path d="M 240 145 Q 220 100 250 80 Q 270 120 285 90 Q 300 130 320 100 Q 340 140 330 155 Z" fill="#7A3B18" stroke="#3D1B0A" stroke-width="1.5" />

    <!-- Glowing Eyes (Black sclera, Magenta Iris) -->
    <ellipse cx="268" cy="188" rx="7" ry="4" fill="#050408" stroke="#E626FF" stroke-width="1" />
    <circle cx="268" cy="188" r="3" fill="url(#eyeGlow)" filter="url(#blurGlow)" />

    <ellipse cx="294" cy="188" rx="7" ry="4" fill="#050408" stroke="#E626FF" stroke-width="1" />
    <circle cx="294" cy="188" r="3" fill="url(#eyeGlow)" filter="url(#blurGlow)" />

    <!-- Smirk / Mouth -->
    <path d="M 270 212 Q 280 216 292 210" stroke="#7A3B18" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Hand holding charged card -->
    <path d="M 220 410 Q 240 400 250 420 L 230 435 Z" fill="#D8A082" />

    <!-- Charged Kinetic Playing Card in Hand -->
    <g transform="translate(210, 350) rotate(-25)">
      <!-- Card Outer Energy Spark Glow -->
      <rect x="-5" y="-5" width="70" height="100" rx="8" fill="none" stroke="#FF3BE6" stroke-width="4" filter="url(#strongGlow)" opacity="0.9" />
      <rect x="0" y="0" width="60" height="90" rx="6" fill="#050408" stroke="#E626FF" stroke-width="2" />
      
      <!-- Energy Veins inside Card -->
      <path d="M 10 10 L 50 80 M 50 10 L 10 80 M 30 5 L 30 85" stroke="#FF3BE6" stroke-width="1.5" filter="url(#blurGlow)" />
      
      <!-- Ace Spade Suit Center Symbol -->
      <path d="M 30 35 C 20 25 15 40 30 55 C 45 40 40 25 30 35 Z M 30 50 L 30 60" fill="#FF3BE6" filter="url(#blurGlow)" />
      
      <text x="8" y="20" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold" fill="#E626FF">A</text>
      <text x="44" y="80" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold" fill="#E626FF">A</text>
    </g>

    <!-- Kinetic Energy Plasma Trails & Sparks floating from hand -->
    <path d="M 200 340 Q 150 280 110 240" fill="none" stroke="#FF3BE6" stroke-width="3" filter="url(#blurGlow)" stroke-dasharray="6,4" />
    <path d="M 240 330 Q 220 220 180 160" fill="none" stroke="#E626FF" stroke-width="2" filter="url(#blurGlow)" stroke-dasharray="4,6" />
    <path d="M 260 370 Q 310 300 360 260" fill="none" stroke="#8F26FF" stroke-width="2.5" filter="url(#blurGlow)" />

    <!-- Small floating energy sparks -->
    <circle cx="160" cy="300" r="3" fill="#FF3BE6" filter="url(#blurGlow)" />
    <circle cx="140" cy="240" r="4" fill="#E626FF" filter="url(#blurGlow)" />
    <circle cx="210" cy="220" r="2.5" fill="#FF3BE6" filter="url(#blurGlow)" />
    <circle cx="280" cy="290" r="3.5" fill="#E626FF" filter="url(#blurGlow)" />
    <circle cx="340" cy="270" r="2" fill="#FF3BE6" filter="url(#blurGlow)" />
  </g>

  <!-- Bottom Vignette Fade Mask -->
  <rect x="0" y="620" width="600" height="180" fill="url(#vignetteFade)" />
  <defs>
    <linearGradient id="vignetteFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050408" stop-opacity="0" />
      <stop offset="60%" stop-color="#050408" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#050408" stop-opacity="1" />
    </linearGradient>
  </defs>
</svg>
